
spring.application.name=biblioteca-idat-api


spring.config.import=optional:file:./application-local.properties


spring.jackson.default-property-inclusion=non_null


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=BibliotecaIdatHikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20


server.port=8080


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.default-produces-media-type=application/json


jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000


app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Location
app.cors.allow-credentials=true
app.cors.max-age=3600


logging.level.com.biblioteca_idat_api.biblioteca_idat_api=INFO
logging.level.org.springframework.security=INFO
